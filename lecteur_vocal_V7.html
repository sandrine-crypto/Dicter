<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Dicter - Lecteur Vocal de Données</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #111827;
      --surface: #1a2332;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Mode normal */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      gap: 16px;
    }

    .app.fullscreen-mode {
      padding: 0;
    }

    header {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .app.fullscreen-mode header {
      display: none;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .badge.ok { background: var(--ok); color: #052e16; border-color: var(--ok); }
    .badge.warn { background: var(--warn); color: #422006; border-color: var(--warn); }
    .badge.err { background: var(--err); color: #450a0a; border-color: var(--err); }

    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
      min-height: 0;
    }

    .app.fullscreen-mode .main-content {
      grid-template-columns: 1fr;
    }

    /* Zone d'affichage principal */
    .display-zone {
      background: var(--panel);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app.fullscreen-mode .display-zone {
      border-radius: 0;
      height: 100vh;
    }

    .display-header {
      padding: 12px 20px;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .display-header .position {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .display-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      overflow: auto;
    }

    .current-row {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 1200px;
    }

    .cell-display {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cell-label {
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: var(--accent);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cell-value {
      font-size: clamp(2rem, 8vw, 6rem);
      font-weight: 700;
      line-height: 1.1;
      word-break: break-word;
    }

    .cell-value.number {
      font-variant-numeric: tabular-nums;
      color: #fbbf24;
    }

    .display-controls {
      padding: 16px 20px;
      background: var(--surface);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      border-top: 1px solid var(--border);
    }

    /* Panneau de contrôle */
    .control-panel {
      background: var(--panel);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app.fullscreen-mode .control-panel {
      display: none;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-section:last-child {
      border-bottom: none;
    }

    .panel-section h3 {
      margin: 0 0 12px 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Formulaires */
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.8rem;
    }

    .form-row {
      margin-bottom: 12px;
    }

    .form-row:last-child {
      margin-bottom: 0;
    }

    .inline-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .inline-row label {
      margin: 0;
      flex: 0 0 auto;
      min-width: 100px;
    }

    .inline-row input, .inline-row select {
      flex: 1;
    }

    /* Boutons */
    button {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.primary {
      background: var(--accent);
      color: white;
    }

    button.primary:hover {
      background: #2563eb;
    }

    button.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #2a3444;
    }

    button.success {
      background: var(--ok);
      color: #052e16;
    }

    button.danger {
      background: var(--err);
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.icon-btn {
      padding: 10px;
      min-width: 44px;
    }

    /* Table de données */
    .data-table-wrap {
      flex: 1;
      overflow: auto;
      min-height: 0;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .data-table th, .data-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .data-table th {
      background: var(--surface);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .data-table tr.active {
      background: rgba(59, 130, 246, 0.15);
    }

    .data-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Slider */
    input[type="range"] {
      -webkit-appearance: none;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      padding: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    /* Mode plein écran */
    .fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .app.fullscreen-mode .fullscreen-btn {
      background: var(--err);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .control-panel {
        order: -1;
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 8px;
        gap: 8px;
      }

      header {
        padding: 12px;
      }

      header h1 {
        font-size: 1rem;
      }

      .cell-value {
        font-size: clamp(1.5rem, 12vw, 4rem);
      }

      .display-controls {
        padding: 12px;
      }

      button {
        padding: 8px 12px;
        font-size: 0.85rem;
      }
    }

    /* RTL pour l'arabe */
    [dir="rtl"] .cell-display {
      direction: rtl;
    }

    /* Status message */
    #statusMessage {
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surface);
      border-radius: 8px;
    }

    /* File input styling */
    input[type="file"] {
      padding: 8px;
    }

    input[type="file"]::file-selector-button {
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      margin-right: 10px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .tab {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1>Dicter - Lecteur Vocal de Données</h1>
      <div class="status-bar">
        <span class="badge" id="ttsBadge">TTS: --</span>
        <span class="badge" id="recoBadge">Micro: --</span>
        <span class="badge" id="dataBadge">0 lignes</span>
      </div>
    </header>

    <main class="main-content">
      <section class="display-zone">
        <div class="display-header">
          <span id="statusMessage">Chargez vos données pour commencer</span>
          <span class="position" id="positionInfo">--</span>
        </div>

        <div class="display-stage" id="displayStage">
          <div class="current-row" id="currentRow">
            <div style="color: var(--muted); font-size: 1.2rem;">
              Importez des données depuis le panneau de droite
            </div>
          </div>
        </div>

        <div class="display-controls">
          <button class="secondary icon-btn" id="prevBtn" disabled title="Précédent">&#9664;</button>
          <button class="primary" id="startBtn" disabled>Démarrer</button>
          <button class="secondary" id="pauseBtn" disabled>Pause</button>
          <button class="success" id="resumeBtn" disabled>Reprendre</button>
          <button class="danger" id="stopBtn" disabled>Stop</button>
          <button class="secondary icon-btn" id="nextBtn" disabled title="Suivant">&#9654;</button>
        </div>
      </section>

      <aside class="control-panel">
        <div class="panel-section">
          <h3>Import des données</h3>

          <div class="tabs">
            <button class="tab active" data-tab="paste">Coller</button>
            <button class="tab" data-tab="file">Fichier</button>
          </div>

          <div class="tab-content active" id="tab-paste">
            <div class="form-row">
              <label for="pasteArea">Collez vos données (colonnes séparées par TAB)</label>
              <textarea id="pasteArea" placeholder="Colonne1&#9;Colonne2&#9;Colonne3&#10;Valeur1&#9;Valeur2&#9;Valeur3"></textarea>
            </div>
            <button class="primary" id="parseBtn" style="width:100%">Analyser les données</button>
          </div>

          <div class="tab-content" id="tab-file">
            <div class="form-row">
              <label for="fileInput">Fichier Excel (.xlsx) ou CSV</label>
              <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.tsv,.txt" />
            </div>
            <button class="primary" id="loadFileBtn" style="width:100%">Charger le fichier</button>
          </div>
        </div>

        <div class="panel-section">
          <h3>Paramètres vocaux</h3>

          <div class="form-row">
            <div class="inline-row">
              <label for="langSelect">Langue</label>
              <select id="langSelect">
                <option value="fr-FR">Français</option>
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="es-ES">Español</option>
                <option value="pt-BR">Português (BR)</option>
                <option value="pt-PT">Português (PT)</option>
                <option value="ar-SA">العربية</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="inline-row">
              <label for="triggerWord">Mot déclencheur</label>
              <input type="text" id="triggerWord" value="suivant" placeholder="suivant, next, siguiente..." />
            </div>
          </div>

          <div class="form-row">
            <div class="inline-row">
              <label>Vitesse</label>
              <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1" />
              <span id="rateValue" style="min-width:30px">1.0</span>
            </div>
          </div>

          <div class="form-row">
            <div class="inline-row">
              <label>Volume</label>
              <input type="range" id="speechVolume" min="0" max="1" step="0.1" value="1" />
              <span id="volumeValue" style="min-width:30px">1.0</span>
            </div>
          </div>

          <div class="form-row">
            <div class="inline-row">
              <label for="autoDelay">Délai auto (s)</label>
              <input type="number" id="autoDelay" min="0" max="60" value="0" style="width:80px" />
              <span style="font-size:0.75rem;color:var(--muted)">0 = désactivé</span>
            </div>
          </div>
        </div>

        <div class="panel-section" style="flex:1;display:flex;flex-direction:column;min-height:0;">
          <h3>Aperçu des données</h3>
          <div class="data-table-wrap">
            <table class="data-table" id="dataTable">
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </main>

    <button class="fullscreen-btn" id="fullscreenBtn" title="Plein écran">&#x26F6;</button>
  </div>

<script>
(function() {
'use strict';

// ============================================
// ÉTAT DE L'APPLICATION
// ============================================
const state = {
  data: [],           // Tableau de lignes, chaque ligne = tableau de cellules
  headers: [],        // En-têtes des colonnes
  currentIndex: -1,   // Index de la ligne courante (-1 = pas démarré)
  isRunning: false,
  isPaused: false,
  isSpeaking: false,
  recognizer: null,
  autoTimer: null,
  recogRestartTimer: null
};

// ============================================
// ÉLÉMENTS DOM
// ============================================
const $ = id => document.getElementById(id);

const elements = {
  app: $('app'),
  ttsBadge: $('ttsBadge'),
  recoBadge: $('recoBadge'),
  dataBadge: $('dataBadge'),
  statusMessage: $('statusMessage'),
  positionInfo: $('positionInfo'),
  displayStage: $('displayStage'),
  currentRow: $('currentRow'),

  prevBtn: $('prevBtn'),
  startBtn: $('startBtn'),
  pauseBtn: $('pauseBtn'),
  resumeBtn: $('resumeBtn'),
  stopBtn: $('stopBtn'),
  nextBtn: $('nextBtn'),

  pasteArea: $('pasteArea'),
  parseBtn: $('parseBtn'),
  fileInput: $('fileInput'),
  loadFileBtn: $('loadFileBtn'),

  langSelect: $('langSelect'),
  triggerWord: $('triggerWord'),
  speechRate: $('speechRate'),
  speechVolume: $('speechVolume'),
  autoDelay: $('autoDelay'),
  rateValue: $('rateValue'),
  volumeValue: $('volumeValue'),

  tableHead: $('tableHead'),
  tableBody: $('tableBody'),

  fullscreenBtn: $('fullscreenBtn')
};

// ============================================
// UTILITAIRES
// ============================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function sanitize(str, maxLen = 500) {
  if (typeof str !== 'string') str = String(str ?? '');
  return str.slice(0, maxLen);
}

function isNumeric(str) {
  if (typeof str !== 'string') return false;
  const normalized = str.trim().replace(',', '.');
  return !isNaN(parseFloat(normalized)) && isFinite(normalized);
}

function formatForSpeech(value, lang) {
  if (!value) return '';
  const str = String(value).trim();

  // Pour les nombres, adapter le format selon la langue
  if (isNumeric(str)) {
    const normalized = str.replace(',', '.');
    const num = parseFloat(normalized);

    // Formater selon la locale
    if (lang.startsWith('fr') || lang.startsWith('pt') || lang.startsWith('es')) {
      // Virgule décimale
      return num.toLocaleString(lang, { maximumFractionDigits: 10 });
    } else if (lang.startsWith('ar')) {
      // Chiffres arabes
      return num.toLocaleString('ar-SA', { maximumFractionDigits: 10 });
    } else {
      // Point décimal (anglais)
      return num.toLocaleString('en-US', { maximumFractionDigits: 10 });
    }
  }

  return str;
}

function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 5);
  if (!lines.length) return '\t';

  const counts = { '\t': 0, ';': 0, ',': 0, '|': 0 };
  for (const line of lines) {
    counts['\t'] += (line.match(/\t/g) || []).length;
    counts[';'] += (line.match(/;/g) || []).length;
    counts[','] += (line.match(/,/g) || []).length;
    counts['|'] += (line.match(/\|/g) || []).length;
  }

  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] || '\t';
}

function parseCSVLine(line, delimiter) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === delimiter && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

function parseTextData(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { headers: [], data: [] };

  const delimiter = detectDelimiter(text);
  const rows = lines.map(line => parseCSVLine(line, delimiter));

  // Première ligne = en-têtes
  const headers = rows[0].map((h, i) => sanitize(h) || 'Colonne ' + (i + 1));
  const data = rows.slice(1).filter(row => row.some(cell => cell.trim()));

  return { headers, data };
}

// ============================================
// SYNTHÈSE VOCALE (TTS)
// ============================================
function checkTTS() {
  if (!window.speechSynthesis) {
    elements.ttsBadge.textContent = 'TTS: indisponible';
    elements.ttsBadge.className = 'badge err';
    return false;
  }
  elements.ttsBadge.textContent = 'TTS: prêt';
  elements.ttsBadge.className = 'badge ok';
  return true;
}

function speak(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || !text) {
      resolve();
      return;
    }

    // Annuler toute lecture en cours
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = elements.langSelect.value;
    utterance.rate = parseFloat(elements.speechRate.value) || 1;
    utterance.volume = parseFloat(elements.speechVolume.value) || 1;

    state.isSpeaking = true;

    utterance.onend = () => {
      state.isSpeaking = false;
      resolve();
    };

    utterance.onerror = (e) => {
      console.warn('Erreur TTS:', e);
      state.isSpeaking = false;
      resolve();
    };

    window.speechSynthesis.speak(utterance);
  });
}

async function speakCurrentRow() {
  if (state.currentIndex < 0 || state.currentIndex >= state.data.length) return;

  const row = state.data[state.currentIndex];
  const lang = elements.langSelect.value;

  // Construire la phrase à dicter
  const parts = [];
  for (let i = 0; i < row.length; i++) {
    const header = state.headers[i] || 'Colonne ' + (i + 1);
    const value = formatForSpeech(row[i], lang);
    if (value) {
      parts.push(header + '. ' + value);
    }
  }

  const sentence = parts.join('. ');
  await speak(sentence);
}

// ============================================
// RECONNAISSANCE VOCALE
// ============================================
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    elements.recoBadge.textContent = 'Micro: non supporté';
    elements.recoBadge.className = 'badge err';
    return null;
  }

  const recognizer = new SpeechRecognition();
  recognizer.continuous = true;
  recognizer.interimResults = false;
  recognizer.lang = elements.langSelect.value;

  recognizer.onstart = () => {
    elements.recoBadge.textContent = 'Micro: actif';
    elements.recoBadge.className = 'badge ok';
  };

  recognizer.onend = () => {
    elements.recoBadge.textContent = 'Micro: arrêté';
    elements.recoBadge.className = 'badge warn';

    // Redémarrer si on est toujours en mode lecture
    if (state.isRunning && !state.isPaused) {
      clearTimeout(state.recogRestartTimer);
      state.recogRestartTimer = setTimeout(() => {
        startListening();
      }, 300);
    }
  };

  recognizer.onerror = (e) => {
    console.warn('Erreur reconnaissance:', e.error);
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      elements.recoBadge.textContent = 'Micro: erreur';
      elements.recoBadge.className = 'badge err';
    }
  };

  recognizer.onresult = (event) => {
    const trigger = elements.triggerWord.value.toLowerCase().trim();
    if (!trigger) return;

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const transcript = event.results[i][0].transcript.toLowerCase().trim();
        console.log('Entendu:', transcript);

        if (transcript.includes(trigger)) {
          goToNext();
        }
      }
    }
  };

  return recognizer;
}

function startListening() {
  if (!state.recognizer) {
    state.recognizer = initRecognition();
  }

  if (!state.recognizer) return;

  state.recognizer.lang = elements.langSelect.value;

  try {
    state.recognizer.start();
  } catch (e) {
    if (e.name !== 'InvalidStateError') {
      console.warn('Erreur démarrage reco:', e);
    }
  }
}

function stopListening() {
  clearTimeout(state.recogRestartTimer);

  if (state.recognizer) {
    try {
      state.recognizer.stop();
    } catch (e) {
      // Ignorer
    }
  }
}

// ============================================
// AFFICHAGE
// ============================================
function updateDisplay() {
  // Mise à jour du badge de données
  const count = state.data.length;
  elements.dataBadge.textContent = count + ' ligne' + (count > 1 ? 's' : '');

  // Position
  if (state.isRunning && state.currentIndex >= 0) {
    elements.positionInfo.textContent = (state.currentIndex + 1) + ' / ' + state.data.length;
  } else {
    elements.positionInfo.textContent = '--';
  }

  // Affichage de la ligne courante
  renderCurrentRow();

  // Table
  updateTable();

  // Boutons
  updateButtons();
}

function renderCurrentRow() {
  const container = elements.currentRow;
  const lang = elements.langSelect.value;
  const isRTL = lang.startsWith('ar');

  container.innerHTML = '';
  container.dir = isRTL ? 'rtl' : 'ltr';

  if (state.currentIndex < 0 || state.currentIndex >= state.data.length) {
    container.innerHTML = '<div style="color: var(--muted); font-size: 1.2rem;">' +
      (state.data.length ? 'Cliquez sur Démarrer' : 'Importez des données') +
    '</div>';
    return;
  }

  const row = state.data[state.currentIndex];

  for (let i = 0; i < row.length; i++) {
    const header = state.headers[i] || 'Colonne ' + (i + 1);
    const value = row[i];
    const isNum = isNumeric(value);

    const cellDiv = document.createElement('div');
    cellDiv.className = 'cell-display';

    const labelDiv = document.createElement('div');
    labelDiv.className = 'cell-label';
    labelDiv.textContent = header;

    const valueDiv = document.createElement('div');
    valueDiv.className = 'cell-value' + (isNum ? ' number' : '');
    valueDiv.textContent = value || '—';

    cellDiv.appendChild(labelDiv);
    cellDiv.appendChild(valueDiv);
    container.appendChild(cellDiv);
  }
}

function updateTable() {
  // En-têtes
  elements.tableHead.innerHTML = '';
  if (state.headers.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<th>#</th>' + state.headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('');
    elements.tableHead.appendChild(tr);
  }

  // Corps
  elements.tableBody.innerHTML = '';
  state.data.forEach((row, idx) => {
    const tr = document.createElement('tr');
    if (idx === state.currentIndex) tr.className = 'active';

    tr.innerHTML = '<td>' + (idx + 1) + '</td>' + row.map(cell => '<td>' + escapeHtml(cell) + '</td>').join('');
    elements.tableBody.appendChild(tr);
  });
}

function updateButtons() {
  const hasData = state.data.length > 0;
  const running = state.isRunning;
  const paused = state.isPaused;

  elements.startBtn.disabled = !hasData || running;
  elements.pauseBtn.disabled = !running || paused;
  elements.resumeBtn.disabled = !running || !paused;
  elements.stopBtn.disabled = !running;
  elements.prevBtn.disabled = !running || state.currentIndex <= 0;
  elements.nextBtn.disabled = !running || state.currentIndex >= state.data.length - 1;
}

function setStatus(msg) {
  elements.statusMessage.textContent = msg;
}

// ============================================
// CONTRÔLES
// ============================================
function clearAutoTimer() {
  if (state.autoTimer) {
    clearTimeout(state.autoTimer);
    state.autoTimer = null;
  }
}

function scheduleAutoAdvance() {
  clearAutoTimer();
  const delay = parseInt(elements.autoDelay.value, 10) || 0;
  if (delay <= 0) return;

  state.autoTimer = setTimeout(() => {
    if (state.isRunning && !state.isPaused) {
      goToNext();
    }
  }, delay * 1000);
}

async function startReading() {
  if (!state.data.length) return;

  state.isRunning = true;
  state.isPaused = false;
  state.currentIndex = 0;

  setStatus('Lecture en cours...');
  updateDisplay();

  await speakCurrentRow();
  startListening();
  scheduleAutoAdvance();
}

function pauseReading() {
  state.isPaused = true;
  clearAutoTimer();
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopListening();

  setStatus('En pause');
  updateButtons();
}

async function resumeReading() {
  state.isPaused = false;

  setStatus('Lecture en cours...');
  updateButtons();

  await speakCurrentRow();
  startListening();
  scheduleAutoAdvance();
}

function stopReading() {
  state.isRunning = false;
  state.isPaused = false;
  state.currentIndex = -1;

  clearAutoTimer();
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopListening();

  setStatus('Arrêté');
  updateDisplay();
}

async function goToPrevious() {
  if (state.currentIndex <= 0) return;

  state.currentIndex--;
  clearAutoTimer();
  updateDisplay();

  await speakCurrentRow();
  scheduleAutoAdvance();
}

async function goToNext() {
  if (state.currentIndex >= state.data.length - 1) {
    // Fin des données
    setStatus('Fin des données');
    stopReading();
    return;
  }

  state.currentIndex++;
  clearAutoTimer();
  updateDisplay();

  await speakCurrentRow();
  scheduleAutoAdvance();
}

// ============================================
// IMPORT DONNÉES
// ============================================
function loadFromTextarea() {
  const text = elements.pasteArea.value;
  if (!text.trim()) {
    setStatus('Collez des données d\'abord');
    return;
  }

  const { headers, data } = parseTextData(text);

  if (!data.length) {
    setStatus('Aucune donnée valide trouvée');
    return;
  }

  state.headers = headers;
  state.data = data;
  state.currentIndex = -1;
  state.isRunning = false;

  setStatus(data.length + ' ligne(s) chargée(s)');
  updateDisplay();
}

async function loadFromFile() {
  const file = elements.fileInput.files && elements.fileInput.files[0];
  if (!file) {
    setStatus('Sélectionnez un fichier');
    return;
  }

  const name = file.name.toLowerCase();
  const isExcel = name.endsWith('.xlsx') || name.endsWith('.xls');

  try {
    if (isExcel) {
      // Charger SheetJS si nécessaire
      if (!window.XLSX) {
        setStatus('Chargement de la librairie Excel...');
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Échec du chargement XLSX'));
          document.head.appendChild(script);
        });
      }

      setStatus('Lecture du fichier Excel...');
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

      if (!rows.length) {
        setStatus('Fichier vide');
        return;
      }

      state.headers = rows[0].map((h, i) => sanitize(String(h)) || 'Colonne ' + (i + 1));
      state.data = rows.slice(1).filter(row => row.some(cell => String(cell).trim()));

    } else {
      // CSV/TSV
      setStatus('Lecture du fichier...');
      const text = await file.text();
      const { headers, data } = parseTextData(text);

      if (!data.length) {
        setStatus('Aucune donnée trouvée');
        return;
      }

      state.headers = headers;
      state.data = data;
    }

    state.currentIndex = -1;
    state.isRunning = false;

    setStatus(state.data.length + ' ligne(s) chargée(s) depuis ' + file.name);
    updateDisplay();

  } catch (err) {
    console.error('Erreur chargement:', err);
    setStatus('Erreur: ' + err.message);
  }
}

// ============================================
// PLEIN ÉCRAN
// ============================================
function toggleFullscreen() {
  elements.app.classList.toggle('fullscreen-mode');

  const isFullscreen = elements.app.classList.contains('fullscreen-mode');
  elements.fullscreenBtn.innerHTML = isFullscreen ? '&#x2715;' : '&#x26F6;';
  elements.fullscreenBtn.title = isFullscreen ? 'Quitter plein écran' : 'Plein écran';

  // API Fullscreen du navigateur
  if (isFullscreen) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

// ============================================
// ÉVÉNEMENTS
// ============================================
function setupEventListeners() {
  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Import
  elements.parseBtn.addEventListener('click', loadFromTextarea);
  elements.loadFileBtn.addEventListener('click', loadFromFile);
  elements.pasteArea.addEventListener('paste', () => setTimeout(loadFromTextarea, 100));

  // Contrôles
  elements.startBtn.addEventListener('click', startReading);
  elements.pauseBtn.addEventListener('click', pauseReading);
  elements.resumeBtn.addEventListener('click', resumeReading);
  elements.stopBtn.addEventListener('click', stopReading);
  elements.prevBtn.addEventListener('click', goToPrevious);
  elements.nextBtn.addEventListener('click', goToNext);

  // Plein écran
  elements.fullscreenBtn.addEventListener('click', toggleFullscreen);

  // Paramètres
  elements.speechRate.addEventListener('input', () => {
    elements.rateValue.textContent = parseFloat(elements.speechRate.value).toFixed(1);
  });

  elements.speechVolume.addEventListener('input', () => {
    elements.volumeValue.textContent = parseFloat(elements.speechVolume.value).toFixed(1);
  });

  elements.langSelect.addEventListener('change', () => {
    if (state.recognizer) {
      state.recognizer.lang = elements.langSelect.value;
    }
    // Rafraîchir l'affichage pour la direction RTL
    if (state.isRunning) {
      renderCurrentRow();
    }
  });

  // Raccourcis clavier
  document.addEventListener('keydown', (e) => {
    if (!state.isRunning) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case 'ArrowRight':
      case 'n':
        e.preventDefault();
        goToNext();
        break;
      case 'ArrowLeft':
      case 'p':
        e.preventDefault();
        goToPrevious();
        break;
      case ' ':
        e.preventDefault();
        state.isPaused ? resumeReading() : pauseReading();
        break;
      case 'Escape':
        e.preventDefault();
        stopReading();
        break;
    }
  });

  // Nettoyage à la fermeture
  window.addEventListener('beforeunload', () => {
    stopReading();
  });

  // Sortie plein écran
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      elements.app.classList.remove('fullscreen-mode');
      elements.fullscreenBtn.innerHTML = '&#x26F6;';
    }
  });
}

// ============================================
// INITIALISATION
// ============================================
function init() {
  checkTTS();
  setupEventListeners();
  updateDisplay();

  // Demander permission micro
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(() => {
        elements.recoBadge.textContent = 'Micro: autorisé';
        elements.recoBadge.className = 'badge ok';
      })
      .catch(() => {
        elements.recoBadge.textContent = 'Micro: bloqué';
        elements.recoBadge.className = 'badge warn';
      });
  }

  setStatus('Chargez vos données pour commencer');
}

// Démarrer
init();

})();
</script>
